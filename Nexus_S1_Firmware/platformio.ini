; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = arduino

; 1. 串口监视器修正：针对 S3 的开门咒
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 1

; 2. 硬件修正：你的板子是 N8，没有 PSRAM，必须用 qspi
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

; 3. 编译修正：去掉 PSRAM 相关定义，保留 USB 调试
build_flags = 
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; --- [TFT_eSPI 屏幕驱动物理注入] ---
    -D USER_SETUP_LOADED=1      ; 告诉库：不要去读默认配置，听我的！
    -D USE_FSPI_PORT=1
    -D ILI9341_DRIVER=1         ; 锁定显卡芯片
    -D TFT_WIDTH=240            ; 物理宽度
    -D TFT_HEIGHT=320           ; 物理高度 (横屏旋转由代码控制)
    -D TFT_MISO=8               ; 临时开发板飞线：共享 FSPI 的 XPT2046 T_DO，非最终 PCB 配置
    -D TFT_MOSI=11              ; 对应 SPI_MOSI_PIN
    -D TFT_SCLK=12              ; 对应 SPI_CLK_PIN
    -D TFT_CS=10                ; 对应 SPI_CS_PIN
    -D TFT_DC=9                 ; 对应 SPI_DC_PIN
    -D TFT_RST=14               ; 对应 SPI_RST_PIN
    -D TFT_BL=13                ; 对应 SPI_BLK_PIN
    -D LOAD_GLCD=1              ; 加载基础字体
    -D SPI_FREQUENCY=40000000   ; 40MHz display SPI; no measured frame-rate claim
    -D LV_CONF_INCLUDE_SIMPLE   ; 告诉 LVGL：不要用相对路径找配置！
    -I include                  ; 强行把 include 文件夹加入系统寻址雷达

lib_ldf_mode = deep+

; 4. 库修正：补上 SPI 和 Wire，解决那个 No such file 报错
lib_deps =
    SPI
    Wire
    tzapu/WiFiManager @ 2.0.17
    adafruit/Adafruit SHT31 Library @ 2.2.2
    adafruit/Adafruit BusIO @ 1.17.4
    bblanchon/ArduinoJson @ 7.4.3
    knolleary/PubSubClient @ 2.8
    bodmer/TFT_eSPI @ 2.5.43
    lvgl/lvgl @ 8.3.11

; OTA is disabled; no network upload endpoint is distributed.

; Controlled temporary-board RAW experiments; all other firmware settings inherited.
; Use explicit -e for build/upload. Default environment above remains checkpoint B.
[env:touch_ab_a]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D NEXUS_TOUCH_RAW_EXPERIMENT=0

[env:touch_ab_b]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D NEXUS_TOUCH_RAW_EXPERIMENT=1

[env:touch_ab_c]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D NEXUS_TOUCH_RAW_EXPERIMENT=2

; Uncalibrated real ADC -> experimental LVGL input. HID output is compiled OFF.
[env:touch_live_preview]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D NEXUS_TOUCH_RAW_EXPERIMENT=0
    -D NEXUS_TOUCH_LIVE_PREVIEW=1

; Explicit opt-in: pressure first, experimental coherent-XY tap when Z is unusable.
[env:touch_live_preview_xy]
extends = env:touch_live_preview
build_flags =
    ${env:touch_live_preview.build_flags}
    -D NEXUS_TOUCH_LIVE_XY_ONLY=1

; D0/D1 share LIVE_PRESSURE, LEGACY30 and every SPI setting. D1 alone freezes
; pixel writes after the initial complete refresh AND lv_timer_handler returns.
[env:touch_spi_diag_d0]
extends = env:touch_live_preview
build_flags =
    ${env:touch_live_preview.build_flags}
    -D NEXUS_TOUCH_SPI_DIAGNOSTIC=1
    -D NEXUS_TOUCH_SPI_FREEZE_TFT=0

[env:touch_spi_diag_d1]
extends = env:touch_live_preview
build_flags =
    ${env:touch_live_preview.build_flags}
    -D NEXUS_TOUCH_SPI_DIAGNOSTIC=1
    -D NEXUS_TOUCH_SPI_FREEZE_TFT=1

; Independent physical encoder preview. RAW A cannot click; TFT never freezes.
; 4 valid quadrature edges per step is provisional, verify the actual module.
[env:encoder_preview]
extends = env:touch_ab_a
build_flags =
    ${env:touch_ab_a.build_flags}
    -D NEXUS_ENCODER_PREVIEW=1
    ; Explicit opt-in for Keyboard/Consumer shortcut output; CDC unchanged.
    -D NEXUS_HID_OUTPUT_DISABLED=0
    -D NEXUS_ENCODER_HID_ENABLED=1
    -D NEXUS_ENCODER_EDGES_PER_STEP=4
    -D NEXUS_ENCODER_DIRECTION=1
